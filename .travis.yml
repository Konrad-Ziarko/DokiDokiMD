language: python
stages:
- setup

install:
  - pip install -r requirements.txt
  - pip install PyInstaller
  - pip install setuptools
  - pip install pytest
  - python setup.py install

jobs:
  include:
    - python: 3.5
    - python: 3.6

    - stage: setup
      script: python setup.py build sdist bdist

script: pytest


