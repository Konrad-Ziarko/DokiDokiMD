language: python
stages:
- make_exe
- setup
- test

install:
  - pip install -r requirements.txt
  - pip install PyInstaller
  - python setup.py install

jobs:
  include:
    - python: 3.5
    - python: 3.6
    - stage: make_exe
      script: python installer/installer.py

    - stage: setup
      script: python setup.py build sdist bdist

    - stage: test
      script: python tests/functional/test_create_pdf_from_jpegs/test_make_pdf.py


